<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>

  <!-- App window -->
  <g filter="url(#sh)">
    <rect x="60" y="40" width="1080" height="380" rx="16" fill="#ffffff"/>
  </g>

  <!-- Title bar -->
  <rect x="60" y="40" width="1080" height="50" rx="16" fill="#f8fafc"/>
  <rect x="60" y="74" width="1080" height="16" fill="#f8fafc"/>
  <circle cx="92" cy="65" r="6" fill="#ef4444"/><circle cx="114" cy="65" r="6" fill="#f59e0b"/><circle cx="136" cy="65" r="6" fill="#22c55e"/>
  <rect x="60" y="89" width="1080" height="1" fill="#e2e8f0"/>

  <!-- Header row -->
  <rect x="92" y="116" width="34" height="34" rx="8" fill="#2563eb"/>
  <text x="109" y="139" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">G</text>
  <text x="140" y="138" font-size="18" font-weight="700" fill="#0f172a">GST Bill Assistant</text>
  <text x="318" y="138" font-size="14" fill="#475569">Purchase Review Desk for CA Firms</text>
  <g font-size="11" font-weight="700">
    <rect x="930" y="123" width="56" height="22" rx="5" fill="#eff6ff" stroke="#bfdbfe"/><text x="958" y="138" text-anchor="middle" fill="#1e40af">v3.3</text>
    <rect x="994" y="123" width="42" height="22" rx="5" fill="#f0fdf4" stroke="#bbf7d0"/><text x="1015" y="138" text-anchor="middle" fill="#15803d">✦ AI</text>
    <rect x="1044" y="123" width="64" height="22" rx="5" fill="#fffbeb" stroke="#fde68a"/><text x="1076" y="138" text-anchor="middle" fill="#b45309">LOCAL</text>
  </g>

  <!-- Metric cards -->
  <g>
    <rect x="92" y="172" width="240" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="112" y="218" font-size="30" font-weight="800" fill="#0f172a">128</text>
    <text x="112" y="244" font-size="12" fill="#94a3b8" letter-spacing="0.5">BILLS EXTRACTED</text>

    <rect x="348" y="172" width="240" height="92" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="368" y="218" font-size="30" font-weight="800" fill="#059669">₹3.4L</text>
    <text x="368" y="244" font-size="12" fill="#94a3b8" letter-spacing="0.5">ITC READY</text>

    <rect x="604" y="172" width="240" height="92" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="624" y="218" font-size="30" font-weight="800" fill="#d97706">₹46k</text>
    <text x="624" y="244" font-size="12" fill="#94a3b8" letter-spacing="0.5">ITC AT RISK</text>

    <rect x="860" y="172" width="240" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="880" y="218" font-size="30" font-weight="800" fill="#2563eb">96%</text>
    <text x="880" y="244" font-size="12" fill="#94a3b8" letter-spacing="0.5">MATCHED IN 2B</text>
  </g>

  <!-- Reconciliation bar -->
  <text x="92" y="300" font-size="13" font-weight="600" fill="#475569">GSTR-2B reconciliation</text>
  <g>
    <rect x="92" y="312" width="1008" height="18" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
    <clipPath id="cb"><rect x="92" y="312" width="1008" height="18" rx="9"/></clipPath>
    <g clip-path="url(#cb)">
      <rect x="92" y="312" width="880" height="18" fill="#059669"/>
      <rect x="972" y="312" width="78" height="18" fill="#d97706"/>
      <rect x="1050" y="312" width="50" height="18" fill="#dc2626"/>
    </g>
  </g>
  <g font-size="12" fill="#475569">
    <rect x="92" y="346" width="10" height="10" rx="2" fill="#059669"/><text x="108" y="355">Matched 118</text>
    <rect x="206" y="346" width="10" height="10" rx="2" fill="#d97706"/><text x="222" y="355">Mismatch 6</text>
    <rect x="322" y="346" width="10" height="10" rx="2" fill="#dc2626"/><text x="338" y="355">Missing in 2B 4</text>
  </g>

  <!-- Tagline -->
  <text x="92" y="398" font-size="15" font-weight="600" fill="#0f172a">Extract · Reconcile with GSTR-2B · Review ITC · Export to Tally / Zoho / Excel</text>
</svg>
