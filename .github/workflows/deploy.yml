# Deploy the static site to GitHub Pages.
#
# This site is plain HTML/CSS/JS with no build step, so we upload the repo
# root directly as the Pages artifact.
#
# ── HOW TO TURN ON DEPLOYMENT (one time) ──────────────────────────────
# 1. Push this repo to GitHub.
# 2. Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
# 3. Run this workflow once: Actions tab → "Deploy to GitHub Pages" → Run workflow.
#    Your site goes live at  https://ayush-syst.github.io/gst-bill-assistant/
# 4. (Optional) To auto-deploy on every push, uncomment the `push:` trigger below.
# ──────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  workflow_dispatch: {}
  # Uncomment to auto-deploy on every push to main once Pages is enabled:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the whole repo root — index.html lives here.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
